# Local test topology. Mirrors the Railway service graph:
#   search -> Meilisearch service (own volume, private)
#   db     -> PocketBase service (own volume, private)
#   web    -> public SvelteKit frontend (wrapper image)
name: wanderer-railway-test

services:
  search:
    image: getmeili/meilisearch:v1.36.0
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: local-test-only-meili-master-key-not-for-production
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meili:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail http://localhost:7700/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  db:
    image: flomp/wanderer-db:v0.20.0
    restart: unless-stopped
    depends_on:
      search:
        condition: service_healthy
    environment:
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: local-test-only-meili-master-key-not-for-production
      POCKETBASE_ENCRYPTION_KEY: local-test-only-pocketbase-key32
      POCKETBASE_PROXY_SECRET: local-test-only-proxy-secret
      ORIGIN: http://localhost:3000
    volumes:
      - pb:/pb_data
    healthcheck:
      test: ['CMD', '/curl', '--fail', 'http://localhost:8090/health']
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    # Built from this repository. CI and the Railway template use the published GHCR image instead.
    build:
      context: .
      args:
        WRAPPER_VERSION: ${WRAPPER_VERSION:-0.0.0-local}
        VCS_REF: ${VCS_REF:-local}
    image: ${WANDERER_RAILWAY_IMAGE:-wanderer-railway:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORIGIN: http://localhost:3000
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: local-test-only-meili-master-key-not-for-production
      POCKETBASE_PROXY_SECRET: local-test-only-proxy-secret
      PUBLIC_POCKETBASE_URL: http://db:8090
      PUBLIC_DISABLE_SIGNUP: 'true'
      PUBLIC_PRIVATE_INSTANCE: 'true'
      BODY_SIZE_LIMIT: Infinity
      WANDERER_OWNER_USERNAME: owner
      WANDERER_OWNER_EMAIL: owner@example.invalid
      WANDERER_OWNER_PASSWORD: local-test-only-owner-password
      APP_READY_TIMEOUT: ${APP_READY_TIMEOUT:-300}
    ports:
      - '127.0.0.1:${WANDERER_TEST_PORT:-3000}:3000'

volumes:
  meili:
  pb:
